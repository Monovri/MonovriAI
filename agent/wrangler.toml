name = "monovri-lead-agent"
main = "worker.js"
compatibility_date = "2024-11-01"

[ai]
binding = "AI"

# Daily marketing content generation (06:00 UTC = 07:00/08:00 CET/CEST).
[triggers]
crons = ["0 6 * * *"]

# Create with `wrangler kv namespace create CONTENT_KV` and paste the id
# here if deploying via CLI. If deploying via the dashboard, add the
# binding there instead (see agent/README.md) — this section is only
# read by `wrangler deploy`.
# [[kv_namespaces]]
# binding = "CONTENT_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Restrict the widget to your real site origin once it's live, e.g.:
# [vars]
# ALLOWED_ORIGIN = "https://monovriai.com"
#
# Leave unset (defaults to "*") while testing locally.
